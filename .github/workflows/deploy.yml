name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # A push on Naijei1/paxos-playground can redeploy this site by POSTing
  # event_type "paxos-playground" to
  # /repos/Naijei1/PersonalWebsite/dispatches.
  # That call needs a token stored in paxos-playground, not here:
  # a classic PAT with public_repo, or a fine-grained PAT with
  # Contents: Read and write on PersonalWebsite. This repo's GITHUB_TOKEN
  # cannot send that event from the other repository. No secret is added
  # in this workflow.
  # A push on Naijei1/gnarly can do the same with event_type "gnarly".
  # That token lives in the gnarly repo, not here. The /gnarly production
  # build checks out Naijei1/gnarly (cursor/aws-backend-1b4f) and inlines the
  # public AWS API and Cognito settings on the Gnarly build step. Google Maps
  # key and map ID stay in Actions secrets. Firebase is not part of this build.
  # schedule and repository_dispatch run only after this file is on main.
  repository_dispatch:
    types: [paxos-playground, gnarly]
  # No-token fallback: rebuild from paxos-playground main and the Gnarly AWS web branch once a day.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout Paxos playground
        uses: actions/checkout@v4
        with:
          repository: Naijei1/paxos-playground
          ref: main
          path: paxos-playground

      - name: Setup Node for Paxos playground
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paxos-playground/package-lock.json

      - name: Build Paxos playground
        working-directory: paxos-playground
        run: npm ci && npm run build

      - name: Mount Paxos at /paxos
        run: bash scripts/mount-paxos.sh paxos-playground/dist dist/paxos

      - name: Checkout Gnarly
        uses: actions/checkout@v4
        with:
          repository: Naijei1/gnarly
          ref: cursor/aws-backend-1b4f
          path: gnarly

      - name: Setup Node for Gnarly web
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnarly/web/package-lock.json

      # Vite inlines VITE_* at build time. AWS and Cognito values are public
      # client config. The Maps key and map ID stay in Actions secrets.
      - name: Build Gnarly web
        working-directory: gnarly/web
        env:
          VITE_GNARLY_API_BASE: https://m7sgp6qsjkimymyrwa6bilxqzq0acbhx.lambda-url.us-east-1.on.aws
          VITE_COGNITO_USER_POOL_ID: us-east-1_pQIUmVbPJ
          VITE_COGNITO_CLIENT_ID: 1osnrt38iuqvf5laum1tnj1hdn
          VITE_COGNITO_DOMAIN: gnarly-naijei.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_URI: https://naijei.com/gnarly/
          VITE_ADMIN_EMAILS: nj277@cornell.edu
          VITE_GNARLY_BUCKET: gnarly-data-402275401617-us-east-1
          VITE_BASE: /gnarly/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
        run: npm ci && npm run build

      - name: Mount Gnarly at /gnarly
        run: bash scripts/mount-gnarly.sh gnarly/web/dist dist/gnarly

      # Landing page lives in this repo. It does not rebuild the companion
      # and it does not change the Cognito redirect above.
      - name: Setup Node for Gnarly landing page
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gnarly-land/package-lock.json

      - name: Build Gnarly landing page
        working-directory: gnarly-land
        env:
          # The motion test uses Playwright locally. The Pages build does not
          # run that test, so it does not need the browser download.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci && npm run build

      - name: Mount Gnarly landing page at /gnarly-land
        run: bash scripts/mount-gnarly-land.sh gnarly-land/dist dist/gnarly-land

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

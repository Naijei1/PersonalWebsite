name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # A push on Naijei1/paxos-playground can redeploy this site by POSTing
  # event_type "paxos-playground" to
  # /repos/Naijei1/PersonalWebsite/dispatches.
  # That call needs a token stored in paxos-playground, not here:
  # a classic PAT with public_repo, or a fine-grained PAT with
  # Contents: Read and write on PersonalWebsite. This repo's GITHUB_TOKEN
  # cannot send that event from the other repository. No secret is added
  # in this workflow.
  # schedule and repository_dispatch run only after this file is on main.
  repository_dispatch:
    types: [paxos-playground]
  # No-token fallback: rebuild from paxos-playground main once a day.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout Paxos playground
        uses: actions/checkout@v4
        with:
          repository: Naijei1/paxos-playground
          ref: main
          path: paxos-playground

      - name: Setup Node for Paxos playground
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paxos-playground/package-lock.json

      - name: Build Paxos playground
        working-directory: paxos-playground
        run: npm ci && npm run build

      - name: Mount Paxos at /paxos
        run: bash scripts/mount-paxos.sh paxos-playground/dist dist/paxos

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Gnarly</title>
  <meta http-equiv="refresh" content="0; url=https://gnarlynav.com/">
  <link rel="canonical" href="https://gnarlynav.com/">
  <script>
    (function () {
      var match = location.pathname.match(/^\/(?:gnarly|gnary)(?:\/(.*))?$/);
      var rest = "";
      if (match) {
        rest = (match[1] || "").replace(/^\/+/, "");
        if (rest === "index.html") rest = "";
      }
      location.replace("https://gnarlynav.com/" + rest + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Gnarly has moved to <a href="https://gnarlynav.com/">gnarlynav.com</a>.</p>
</body>
</html>
